<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório de Tráfego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --text: #f0efec;
    --muted: #9a998f;
    --win-bg: #ececec;
    --win-line: #000;
    --win-head: #3a7ea3;
    --win-head-2: #2c6788;
    --card: #ffffff;
    --card-line: #c9c9c4;
    --ink: #111;
    --ink-2: #52514e;
    --accent: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --pixel: "Pixelify Sans", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

  /* Barra superior estilo Habbo */
  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 10px; }
  header.top h1 { font-family: var(--pixel); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: .5px; text-shadow: 2px 2px 0 #2c6788; }
  .tag { font-family: var(--pixel); font-size: 12px; color: #111; background: var(--warning); border: 2px solid #000; padding: 1px 8px; border-radius: 6px; }

  .hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .hud .tile { background: #1c1c1c; border: 2px solid #3d3d3d; border-radius: 8px; padding: 8px 12px; min-width: 0; box-shadow: inset 0 -3px 0 #111; }
  .hud .k { font-family: var(--pixel); font-size: 12px; color: var(--muted); letter-spacing: .3px; }
  .hud .v { font-family: var(--pixel); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud .s { margin-top: 2px; }
  .hud input { width: 100%; font-family: var(--pixel); font-size: 20px; font-weight: 700; color: var(--text); background: #000; border: 2px solid #3d3d3d; border-radius: 6px; padding: 1px 8px; }
  .hud input:focus-visible { outline: 2px solid var(--warning); outline-offset: 1px; }

  .stage { position: relative; background: #000; border: 2px solid #2a2a2a; border-radius: 10px 10px 0 0; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; touch-action: manipulation; }

  /* Barra de ferramentas inferior */
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: linear-gradient(#2b2b2b, #1a1a1a); border: 2px solid #2a2a2a; border-top: 2px solid #4a4a4a; border-radius: 0 0 10px 10px; }
  .toolbar button {
    font-family: var(--pixel); font-size: 14px; color: #fff; background: linear-gradient(#4b4b4b, #333); border: 2px solid #000;
    border-radius: 6px; padding: 5px 10px; cursor: pointer; box-shadow: inset 0 1px 0 #6a6a6a, 0 2px 0 #000;
  }
  .toolbar button:hover { background: linear-gradient(#5a6f7c, #3a4d58); }
  .toolbar button:active { transform: translateY(1px); box-shadow: inset 0 1px 0 #6a6a6a; }
  .toolbar button:focus-visible { outline: 2px solid var(--warning); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 2px 0; font-family: var(--pixel); }

  /* Status: ícone + texto, nunca só cor */
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 1px 8px 1px 3px; border-radius: 99px; background: #f2f2ef; color: var(--ink); border: 1px solid var(--card-line); white-space: nowrap; }
  .hud .status { background: #2a2a2a; color: var(--text); border-color: #3d3d3d; }
  .status i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 11px; font-weight: 800; color: #111; }
  .status.good i { background: var(--good); color: #fff; }
  .status.warning i { background: var(--warning); }
  .status.critical i { background: var(--critical); color: #fff; }

  /* Janela estilo Habbo */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow-y: auto; z-index: 10; }
  .backdrop.open { display: flex; }
  .modal { background: var(--win-bg); color: var(--ink); border: 2px solid var(--win-line); border-radius: 9px; width: 100%; max-width: 900px; box-shadow: 0 6px 0 rgba(0,0,0,.4); overflow: hidden; }
  .modal-head { display: flex; align-items: center; gap: 8px; background: linear-gradient(var(--win-head), var(--win-head-2)); border-bottom: 2px solid var(--win-line); padding: 6px 8px 6px 12px; }
  .modal-head h2 { font-family: var(--pixel); font-weight: 700; color: #fff; margin: 0; font-size: 18px; flex: 1; text-shadow: 1px 1px 0 #000; min-width: 0; }
  .close { width: 26px; height: 26px; border-radius: 5px; border: 2px solid #000; background: linear-gradient(#e35b4f, #b2342a); color: #fff; font: 700 15px/1 var(--pixel); cursor: pointer; box-shadow: inset 0 1px 0 #ff9c92; flex: none; }
  .close:focus-visible { outline: 2px solid var(--warning); outline-offset: 2px; }
  .modal-body { padding: 14px 16px 18px; }
  .modal h3 { font-family: var(--pixel); font-size: 15px; margin: 16px 0 8px; color: var(--ink); }
  .modal .sub { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .kpis .tile { background: var(--card); border: 1px solid var(--card-line); border-radius: 7px; padding: 8px 10px; }
  .kpis .k { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .4px; }
  .kpis .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpis .s { font-size: 12px; color: var(--ink-2); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
  .chart { background: #fcfcfb; border: 1px solid var(--card-line); border-radius: 7px; padding: 10px; }
  .chart .t { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .scroll { overflow-x: auto; border: 1px solid var(--card-line); border-radius: 7px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid #e3e3df; white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; background: #f4f4f1; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  td.wrap-cell { white-space: normal; min-width: 240px; text-align: left; color: var(--ink-2); }
  .card { background: var(--card); border: 1px solid var(--card-line); border-radius: 7px; padding: 10px 14px; margin-bottom: 10px; }
  .card h4 { margin: 0 0 6px; font-size: 15px; }
  .card ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); }
  .copy { font-size: 13px; color: var(--ink-2); margin: 4px 0 0; }
  .copy b { color: var(--ink); }
  .summary { font-size: 15px; line-height: 1.6; }

  #tip { position: fixed; pointer-events: none; z-index: 20; background: #fff; color: var(--ink); border: 2px solid #000; border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; white-space: nowrap; }

  @media (max-width: 640px) {
    .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .modal-body { padding: 12px; }
    .backdrop { padding: 12px 8px; }
    .toolbar button { font-size: 13px; padding: 4px 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🏢 Escritório de Tráfego</h1>
    <span class="tag">Dados de demonstração</span>
  </header>

  <section class="hud" aria-label="Resumo dos últimos 7 dias">
    <div class="tile"><div class="k">Investimento · 7d</div><div class="v" id="hudSpend">–</div></div>
    <div class="tile"><div class="k">Leads · 7d</div><div class="v" id="hudLeads">–</div></div>
    <div class="tile"><div class="k">CPL médio · 7d</div><div class="v" id="hudCpl">–</div><div class="s" id="hudCplStatus"></div></div>
    <div class="tile"><label class="k" for="metaInput">Meta de CPL (R$)</label><input id="metaInput" type="number" min="1" step="1" inputmode="decimal"></div>
  </section>

  <div class="stage">
    <canvas id="office" aria-label="Escritório virtual isométrico. Use a barra abaixo para abrir as TVs e os colaboradores."></canvas>
  </div>
  <nav class="toolbar" id="toolbar" aria-label="Atalhos"></nav>
  <p class="hint">Clique numa TV para analisar a campanha, ou num colaborador para ver o trabalho dele. Clique no Gerente para receber o relatório geral.</p>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="closeBtn" aria-label="Fechar">X</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div id="tip" role="status"></div>

<script>
(() => {
  // ---------- Formatação ----------
  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const brl0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const int = new Intl.NumberFormat('pt-BR');
  const dec = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pct = v => (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
  const money = v => isFinite(v) ? brl.format(v) : '—';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- Meta de CPL ----------
  const META_KEY = 'escritorio.metaCPL';
  let metaCPL = 200;
  try { const v = parseFloat(localStorage.getItem(META_KEY)); if (v > 0) metaCPL = v; } catch (e) {}

  const STATUS = {
    good: { icon: '✓', label: 'Dentro da meta', color: '#0ca30c' },
    warning: { icon: '!', label: 'Atenção', color: '#fab219' },
    critical: { icon: '✕', label: 'Acima da meta', color: '#d03b3b' },
  };
  const statusOf = cpl => cpl <= metaCPL ? 'good' : cpl <= metaCPL * 1.3 ? 'warning' : 'critical';
  const badge = cpl => { const s = statusOf(cpl); return `<span class="status ${s}"><i>${STATUS[s].icon}</i>${STATUS[s].label}</span>`; };

  // ---------- Dados falsos (determinísticos) ----------
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rand = rng(20261015);

  const DAYS = 7;
  const dayLabels = Array.from({ length: DAYS }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (DAYS - 1 - i));
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  });

  const CAMPAIGNS = [
    { id: 'c1', name: 'Lead Magnet - eBook', short: 'eBook', budget: 900, cpl: 150, adsets: [
      { name: 'Interesse - Marketing Digital', share: .55, ads: [
        { name: 'Vídeo depoimento', ctr: .016, mult: .85, headline: 'eBook grátis: 7 passos para dobrar seus leads', text: 'Mais de 3.000 empresários já baixaram. Descubra o método que usamos com nossos clientes.' },
        { name: 'Carrossel checklist', ctr: .012, mult: 1.15, headline: 'O checklist que todo gestor deveria ter', text: 'Baixe agora o eBook e pare de perder dinheiro com anúncios que não convertem.' },
      ]},
      { name: 'Lookalike 1% - Leads', share: .45, ads: [
        { name: 'Imagem capa do eBook', ctr: .014, mult: .95, headline: 'Seu próximo cliente está a um clique', text: 'Material gratuito com estratégias testadas em mais de 200 campanhas.' },
        { name: 'Reels bastidores', ctr: .011, mult: 1.1, headline: 'Veja como captamos 1.000 leads em 30 dias', text: 'Mostramos tudo no eBook gratuito. Link na página.' },
      ]},
    ]},
    { id: 'c2', name: 'WhatsApp - Consultoria', short: 'Consultoria', budget: 1200, cpl: 232, adsets: [
      { name: 'Público aberto - 25 a 45', share: .5, ads: [
        { name: 'Vídeo especialista', ctr: .013, mult: .9, headline: 'Fale com um especialista agora', text: 'Diagnóstico gratuito das suas campanhas pelo WhatsApp. Vagas limitadas esta semana.' },
        { name: 'Imagem prova social', ctr: .009, mult: 1.2, headline: '+R$ 2 milhões gerenciados em anúncios', text: 'Agende sua consultoria e descubra onde está o desperdício.' },
      ]},
      { name: 'Interesse - Empreendedorismo', share: .5, ads: [
        { name: 'Carrossel resultados', ctr: .011, mult: 1.0, headline: 'Resultados reais de clientes reais', text: 'Clique e converse com nosso time pelo WhatsApp.' },
        { name: 'Vídeo depoimento cliente', ctr: .012, mult: 1.05, headline: '"Triplicamos os leads em 2 meses"', text: 'Quer o mesmo para sua empresa? Chame no WhatsApp.' },
      ]},
    ]},
    { id: 'c3', name: 'Remarketing 30d', short: 'Remarketing', budget: 600, cpl: 330, adsets: [
      { name: 'Visitantes do site 30d', share: .6, ads: [
        { name: 'Imagem oferta', ctr: .010, mult: .95, headline: 'Ainda pensando? Sua vaga está reservada', text: 'Volte e finalize seu cadastro. Bônus exclusivo até sexta.' },
        { name: 'Vídeo FAQ', ctr: .007, mult: 1.25, headline: 'Tire suas dúvidas em 60 segundos', text: 'Respondemos as 5 perguntas mais comuns antes de você decidir.' },
      ]},
      { name: 'Engajou no Instagram 30d', share: .4, ads: [
        { name: 'Carrossel benefícios', ctr: .009, mult: 1.0, headline: '5 motivos para começar hoje', text: 'Você já nos conhece. Agora é a hora de dar o próximo passo.' },
        { name: 'Stories urgência', ctr: .008, mult: 1.1, headline: 'Últimas horas', text: 'O bônus acaba hoje à meia-noite.' },
      ]},
    ]},
  ];

  const blank = () => ({ spend: 0, imp: 0, reach: 0, clicks: 0, lpv: 0, leads: 0 });
  const add = (a, b) => { for (const k in a) a[k] += b[k]; return a; };

  for (const c of CAMPAIGNS) {
    for (const s of c.adsets) {
      for (const ad of s.ads) {
        ad.daily = [];
        for (let d = 0; d < DAYS; d++) {
          const spend = c.budget * s.share * .5 * (.85 + .25 * rand());
          const cpm = 22 + 16 * rand();
          const imp = Math.round(spend / cpm * 1000);
          const clicks = Math.round(imp * ad.ctr * (.85 + .3 * rand()));
          const lpv = Math.round(clicks * (.66 + .2 * rand()));
          const leads = Math.min(lpv, Math.max(0, Math.floor(spend / (c.cpl * ad.mult) * (.7 + .6 * rand()) + rand())));
          const reach = Math.round(imp / (1.05 + .15 * rand()));
          ad.daily.push({ spend, imp, reach, clicks, lpv, leads });
        }
      }
      s.daily = Array.from({ length: DAYS }, (_, d) => s.ads.reduce((acc, ad) => add(acc, ad.daily[d]), blank()));
    }
    c.daily = Array.from({ length: DAYS }, (_, d) => c.adsets.reduce((acc, s) => add(acc, s.daily[d]), blank()));
  }

  // Métricas derivadas de um conjunto de linhas diárias.
  function metrics(rows) {
    const m = rows.reduce((acc, r) => add(acc, r), blank());
    const reachPeriod = rows.length > 1 ? m.reach * .62 : m.reach;
    return {
      ...m,
      cpl: m.leads ? m.spend / m.leads : Infinity,
      ctr: m.imp ? m.clicks / m.imp : 0,
      cpc: m.clicks ? m.spend / m.clicks : 0,
      cpm: m.imp ? m.spend / m.imp * 1000 : 0,
      connect: m.clicks ? m.lpv / m.clicks : 0,
      conv: m.lpv ? m.leads / m.lpv : 0,
      freq: reachPeriod ? m.imp / reachPeriod : 0,
    };
  }
  const allDaily = Array.from({ length: DAYS }, (_, d) => CAMPAIGNS.reduce((acc, c) => add(acc, c.daily[d]), blank()));
  for (const c of CAMPAIGNS) { c.m = metrics(c.daily); for (const s of c.adsets) { s.m = metrics(s.daily); for (const ad of s.ads) ad.m = metrics(ad.daily); } }
  const allAds = CAMPAIGNS.flatMap(c => c.adsets.flatMap(s => s.ads.map(ad => ({ ad, s, c }))));
  const allSets = CAMPAIGNS.flatMap(c => c.adsets.map(s => ({ s, c })));
  const total = () => metrics(allDaily);

  // ---------- HUD ----------
  function renderHud() {
    const t = total();
    document.getElementById('hudSpend').textContent = brl0.format(t.spend);
    document.getElementById('hudLeads').textContent = int.format(t.leads);
    document.getElementById('hudCpl').textContent = money(t.cpl);
    document.getElementById('hudCplStatus').innerHTML = badge(t.cpl);
  }
  const metaInput = document.getElementById('metaInput');
  metaInput.value = metaCPL;
  metaInput.addEventListener('change', () => {
    const v = parseFloat(metaInput.value);
    if (!(v > 0)) { metaInput.value = metaCPL; return; }
    metaCPL = v;
    try { localStorage.setItem(META_KEY, String(v)); } catch (e) {}
    renderHud();
  });
  renderHud();

  // =====================================================================
  //  Escritório isométrico
  // =====================================================================
  const W = 480, H = 316;
  const TW = 32, TH = 16;          // losango do piso (2:1)
  const GX = 13, GY = 10;          // tamanho da sala em tiles
  const WALL = 96;                 // altura da parede
  const OX = W / 2 + (GY - GX) * TW / 4, OY = 112;
  const FONT = '"Pixelify Sans", ui-monospace, monospace';

  const canvas = document.getElementById('office');
  const ctx = canvas.getContext('2d');
  canvas.style.aspectRatio = W + ' / ' + H;
  let K = 1;
  function resize() {
    const cssW = canvas.clientWidth || W, dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssW * H / W * dpr);
    K = canvas.width / W;
  }
  window.addEventListener('resize', resize);
  resize();

  // gx cresce para baixo-direita, gy para baixo-esquerda, h para cima.
  const iso = (gx, gy, h = 0) => [OX + (gx - gy) * TW / 2, OY + (gx + gy) * TH / 2 - h];

  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  function poly(pts, fill, stroke) {
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = .6; ctx.stroke(); }
  }
  // Caixa isométrica: ocupa [gx, gx+w] x [gy, gy+d], da altura z até z+h.
  function box(gx, gy, w, d, h, col, z = 0, edge = 'rgba(0,0,0,.45)') {
    const t = z + h;
    poly([iso(gx, gy + d, t), iso(gx + w, gy + d, t), iso(gx + w, gy + d, z), iso(gx, gy + d, z)], col[1], edge);
    poly([iso(gx + w, gy, t), iso(gx + w, gy + d, t), iso(gx + w, gy + d, z), iso(gx + w, gy, z)], col[2], edge);
    poly([iso(gx, gy, t), iso(gx + w, gy, t), iso(gx + w, gy + d, t), iso(gx, gy + d, t)], col[0], edge);
  }
  // Desenho "colado" numa parede: (u, v) local -> parede direita (gy=0) ou esquerda (gx=0).
  function onWall(side, start, hTop, fn) {
    ctx.save();
    if (side === 'R') { const [x, y] = iso(start, 0, hTop); ctx.transform(1, .5, 0, 1, x, y); }
    else { const [x, y] = iso(0, start, hTop); ctx.transform(1, -.5, 0, 1, x, y); }
    fn(); ctx.restore();
  }
  const text = (s, x, y, size, color, weight = 400, align = 'left') => {
    ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.fillText(s, x, y);
  };

  // ---------- Pessoas e móveis ----------
  const PEOPLE = {
    gestor:   { role: 'Gestor de Tráfego', tag: 'Gestor',   at: [2, 2.45],  desk: [1, 2.95], look: { skin: '#e8b88a', hair: '#3b2614', shirt: '#2a78d6', pants: '#2b3350' } },
    copy:     { role: 'Copywriter',        tag: 'Copy',     at: [6, 2.45],  desk: [5, 2.95], look: { skin: '#f3cfa2', hair: '#b5532c', shirt: '#eb6834', pants: '#3a2f2a', long: true } },
    analista: { role: 'Analista de Dados', tag: 'Analista', at: [10, 2.45], desk: [9, 2.95], look: { skin: '#8d5524', hair: '#151515', shirt: '#1baf7a', pants: '#262626', glasses: true } },
    gerente:  { role: 'Gerente',           tag: 'Gerente',  at: [6, 6.75],  desk: [5, 7.25], look: { skin: '#c68642', hair: '#6b6b6b', shirt: '#2a2f3d', pants: '#1f2533', suit: true } },
  };
  for (const id in PEOPLE) {
    const p = PEOPLE[id];
    p.id = id; p.seat = { x: p.at[0], y: p.at[1] }; p.pos = { ...p.seat };
    p.walking = false; p.back = false;
  }
  const isSeated = p => !p.walking && p.pos.x === p.seat.x && p.pos.y === p.seat.y;

  // ---------- Sala ----------

    const t = total();

  function drawTV(tv, t) {

  // ---------- Móveis ----------
  const WOOD = ['#c99b62', '#8f6538', '#a87843'];
  function drawDesk(p) {

    const [x0] = iso(gx, gy + 1), [x1] = iso(gx + 2, gy), [, yT] = iso(gx, gy, 32), [, yB] = iso(gx + 2, gy + 1);

  function plant(gx, gy) {

  // ---------- Avatar estilo Habbo ----------
  function avatar(p, t) {
    const L = p.look, seated = isSeated(p);
    let [x, y] = iso(p.pos.x, p.pos.y);
    x = Math.round(x); y = Math.round(y);
    const O = 'rgba(0,0,0,.75)';
    const step = p.walking ? (Math.floor(t / 150) % 2 ? 1 : -1) : 0;
    if (!seated) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y, 9, 4, 0, 0, Math.PI * 2); ctx.fill(); }
    const by = seated ? y - 10 : y;      // base do corpo
    if (!seated) {
      R(x - 6, by - 14, 12, 12, O);
      R(x - 5, by - 13 + Math.max(0, step), 4, 11 - Math.max(0, step), L.pants);
      R(x + 1, by - 13 + Math.max(0, -step), 4, 11 - Math.max(0, -step), L.pants);
      R(x - 6, by - 3 - Math.max(0, -step), 5, 3, '#1a1a1a'); R(x + 1, by - 3 - Math.max(0, step), 5, 3, '#1a1a1a');
    } else {
      R(x - 6, by - 4, 12, 5, O); R(x - 5, by - 3, 10, 3, L.pants);
    }
    // Tronco
    R(x - 8, by - 28, 16, 16, O);
    R(x - 7, by - 27, 14, 14, L.shirt);
    R(x - 7, by - 15, 14, 2, 'rgba(0,0,0,.18)');
    if (L.suit && !p.back) { R(x - 2, by - 27, 4, 9, '#f2f2f2'); R(x - 1, by - 26, 2, 8, '#d03b3b'); }
    // Braços
    const typing = seated && p.id !== 'gerente' ? Math.floor(t / 170 + p.seat.x) % 2 : 0;
    R(x - 10, by - 27, 4, 12, O); R(x + 6, by - 27, 4, 12, O);
    R(x - 9, by - 26, 2, 9, L.shirt); R(x + 7, by - 26, 2, 9, L.shirt);
    R(x - 9, by - 17 - typing, 2, 3, L.skin); R(x + 7, by - 17 - (seated && p.id !== 'gerente' ? 1 - typing : 0), 2, 3, L.skin);
    // Cabeça grande
    R(x - 8, by - 43, 16, 16, O);
    R(x - 7, by - 42, 14, 14, L.skin);
    R(x - 7, by - 30, 14, 2, 'rgba(0,0,0,.12)');
    if (p.back) {
      R(x - 7, by - 44, 14, 13, L.hair); R(x - 8, by - 43, 1, 10, O); R(x + 7, by - 43, 1, 10, O);
    } else {
      R(x - 8, by - 45, 16, 7, O);
      R(x - 7, by - 44, 14, 5, L.hair);
      R(x - 7, by - 40, 3, L.long ? 12 : 4, L.hair); R(x + 4, by - 40, 3, L.long ? 12 : 3, L.hair);
      if (L.long) { R(x - 8, by - 40, 1, 12, O); R(x + 7, by - 40, 1, 12, O); }
      // Rosto em 3/4, virado para baixo-esquerda (como no Habbo)
      R(x - 5, by - 36, 2, 3, '#1a1a1a'); R(x + 1, by - 36, 2, 3, '#1a1a1a');
      R(x - 5, by - 36, 1, 1, '#fff'); R(x + 1, by - 36, 1, 1, '#fff');
      if (L.glasses) { R(x - 6, by - 37, 4, 1, '#eee'); R(x, by - 37, 4, 1, '#eee'); R(x - 2, by - 36, 2, 1, '#eee'); }
      R(x - 3, by - 31, 3, 1, '#9a4a3a');
    }
    // Etiqueta com o nome
    ctx.font = `600 6px ${FONT}`;
    const tw = ctx.measureText(p.tag).width + 8, hot = hover === p;
    R(x - tw / 2, by - 55, tw, 9, hot ? '#ffe066' : 'rgba(0,0,0,.65)');
    text(p.tag, x, by - 54, 6, hot ? '#111' : '#fff', 600, 'center');
    regions.push({ x: x - 10, y: by - 56, w: 20, h: (seated ? 46 : 58), target: p });
  }

  // ---------- Balões de chat (pilha no topo, como no Habbo) ----------
  const chat = [];
  function say(p, msg) {
    chat.forEach(m => m.ty -= 17);
    chat.push({ p, msg, y: 78, ty: 62, born: performance.now() });
  }
  function drawChat(t) {
    for (let i = chat.length - 1; i >= 0; i--) if (chat[i].ty < -20 || t - chat[i].born > 14000) chat.splice(i, 1);
    for (const m of chat) {
      m.y += (m.ty - m.y) * .18;
      const name = m.p.tag + ': ';
      ctx.font = `700 7px ${FONT}`; const nw = ctx.measureText(name).width;
      ctx.font = `400 7px ${FONT}`; const mw = ctx.measureText(m.msg).width;
      const w = nw + mw + 22, h = 14, [px] = iso(m.p.pos.x, m.p.pos.y);
      const x = Math.max(4, Math.min(W - w - 4, px - w / 2)), y = Math.round(m.y);
      const age = t - m.born; ctx.globalAlpha = age > 12000 ? Math.max(0, 1 - (age - 12000) / 2000) : 1;
      // Balão com borda preta e cantos arredondados
      ctx.fillStyle = '#000'; roundRect(x - 1, y - 1, w + 2, h + 2, 5); ctx.fill();
      ctx.fillStyle = '#fff'; roundRect(x, y, w, h, 4); ctx.fill();
      const tx = Math.max(x + 8, Math.min(x + w - 8, px));
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(tx - 4, y + h); ctx.lineTo(tx, y + h + 4); ctx.lineTo(tx + 4, y + h); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(tx - 3, y + h - 1); ctx.lineTo(tx, y + h + 2.5); ctx.lineTo(tx + 3, y + h - 1); ctx.fill();
      // Mini cabeça do autor
      R(x + 3, y + 3, 8, 8, '#000'); R(x + 4, y + 4, 6, 6, m.p.look.skin); R(x + 4, y + 4, 6, 2, m.p.look.hair);
      R(x + 5, y + 7, 1, 1, '#000'); R(x + 8, y + 7, 1, 1, '#000');
      text(name, x + 14, y + 3.5, 7, '#111', 700);
      text(m.msg, x + 14 + nw, y + 3.5, 7, '#111', 400);
      ctx.globalAlpha = 1;
    }
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  // ---------- Ronda do gerente ----------
  let tour = null;
  const REPLIES = {
    gestor: () => `Investimos ${brl0.format(total().spend)} em 7 dias.`,
    copy: () => { const b = [...allAds].sort((a, z) => z.ad.m.ctr - a.ad.m.ctr)[0]; return `Melhor CTR: ${b.ad.name} (${pct(b.ad.m.ctr)})`; },
    analista: () => { const b = [...CAMPAIGNS].sort((a, z) => a.m.cpl - z.m.cpl)[0]; return `Top campanha: ${b.short}, CPL ${brl0.format(b.m.cpl)}`; },
  };
  function startTour() {
    if (tour) return;
    const g = PEOPLE.gerente, aisle = 4.75;
    const path = [{ x: g.seat.x, y: aisle }];
    ['gestor', 'copy', 'analista'].forEach(id => path.push({ x: PEOPLE[id].seat.x, y: aisle, visit: id }));
    path.push({ x: g.seat.x, y: aisle }, { x: g.seat.x, y: g.seat.y, end: true });
    tour = { path, i: 0, wait: 0 };
    g.walking = true;
    say(g, 'Equipe, bora fechar o relatório do dia!');
  }
  function updateTour(dt) {
    if (!tour) return;
    const g = PEOPLE.gerente;
    if (tour.wait > 0) { tour.wait -= dt; return; }
    const tg = tour.path[tour.i];
    const dx = tg.x - g.pos.x, dy = tg.y - g.pos.y, dist = Math.hypot(dx, dy), sp = .0028 * dt;
    g.walking = true;
    g.back = dx + dy < -0.001;
    if (dist <= sp) {
      g.pos.x = tg.x; g.pos.y = tg.y;
      if (tg.visit) { g.back = true; say(PEOPLE[tg.visit], REPLIES[tg.visit]()); tour.wait = 1200; }
      if (tg.end) { g.walking = false; g.back = false; tour = null; openGerente(); return; }
      tour.i++;
    } else { g.pos.x += dx / dist * sp; g.pos.y += dy / dist * sp; }
  }

  // Conversa espontânea
  const CHATTER = [
    () => [PEOPLE.analista, (() => { const b = [...CAMPAIGNS].sort((a, z) => a.m.cpl - z.m.cpl)[0]; return `${b.short} é a melhor: CPL ${brl0.format(b.m.cpl)}`; })()],
    () => [PEOPLE.gestor, (() => { const w = [...CAMPAIGNS].sort((a, z) => z.m.cpl - a.m.cpl)[0]; return statusOf(w.m.cpl) === 'critical' ? `De olho no ${w.short}, CPL alto!` : 'Todas as campanhas rodando.'; })()],
    () => [PEOPLE.copy, (() => { const b = [...allAds].sort((a, z) => z.ad.m.ctr - a.ad.m.ctr)[0]; return `"${b.ad.headline}" está bombando`; })()],
    () => [PEOPLE.gerente, `Meta de CPL: abaixo de ${brl0.format(metaCPL)}. Foco!`],
    () => [PEOPLE.analista, `Connect rate geral: ${pct(total().connect)}`],
  ];
  let nextChat = 1500, chatIdx = 0;

  // ---------- Loop ----------
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(60, t - last); last = t;
    updateTour(dt);
    if (!tour && t > nextChat && !backdrop.classList.contains('open')) { const [p, m] = CHATTER[chatIdx++ % CHATTER.length](); say(p, m); nextChat = t + 5000; }

    regions = [];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(K, 0, 0, K, 0, 0);
    drawRoom();
    TVS.forEach(tv => drawTV(tv, t));

    // Ordem de desenho por profundidade (gx + gy)
    const items = [
      { z: .9, draw: () => plant(.15, .2) },
      { z: 13, draw: () => cooler(12.3, .35) },
      { z: 5.9, draw: () => sofa(.1, 4.7) },
      { z: 7.5, draw: () => lowTable(1.4, 5.4) },
      { z: 8.6, draw: () => shelf(0, 7.8) },
      { z: 21.5, draw: () => plant(12.2, 9.2) },
      { z: 10.2, draw: () => plant(.2, 9.3) },
    ];
    for (const id in PEOPLE) {
      const p = PEOPLE[id];
      items.push({ z: p.desk[0] + 1 + p.desk[1] + .5, draw: () => drawDesk(p) });
      items.push({ z: p.seat.x + p.seat.y - .2, draw: () => drawChair(p) });
      items.push({ z: isSeated(p) ? p.seat.x + p.seat.y : p.pos.x + p.pos.y + .3, draw: () => avatar(p, t) });
    }
    items.sort((a, b) => a.z - b.z).forEach(i => i.draw());
    drawChat(t);
    requestAnimationFrame(frame);
  }

  // ---------- Clique / hover ----------
  function toLogical(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
  function hitTest(x, y) {
    for (let i = regions.length - 1; i >= 0; i--) { const g = regions[i]; if (x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + g.h) return g.target; }
    return null;
  }
  canvas.addEventListener('mousemove', e => {
    const [x, y] = toLogical(e);
    hover = hitTest(x, y);
    canvas.style.cursor = hover ? 'pointer' : 'default';
    const a = (x - OX) / (TW / 2), b = (y - OY) / (TH / 2), gx = Math.floor((a + b) / 2), gy = Math.floor((b - a) / 2);
    hoverTile = gx >= 0 && gy >= 0 && gx < GX && gy < GY ? [gx, gy] : null;
  });
  canvas.addEventListener('mouseleave', () => { hover = null; hoverTile = null; });
  canvas.addEventListener('click', e => { const h = hitTest(...toLogical(e)); if (h) activate(h); });

  function activate(h) {
    if (h.c) return openTV(h.c);
    if (h.id === 'gerente') return startTour();
    ({ gestor: openGestor, copy: openCopy, analista: openAnalista })[h.id]();
  }

  const toolbar = document.getElementById('toolbar');
  TVS.forEach(tv => { const b = document.createElement('button'); b.textContent = '📺 ' + tv.c.short; b.title = tv.c.name; b.onclick = () => activate(tv); toolbar.appendChild(b); });
  [['gestor', '👨‍💻'], ['copy', '✍️'], ['analista', '📊'], ['gerente', '👔']].forEach(([id, ic]) => {
    const b = document.createElement('button'); b.textContent = ic + ' ' + PEOPLE[id].role; b.onclick = () => activate(PEOPLE[id]); toolbar.appendChild(b);
  });

  // ---------- Janela ----------
  const backdrop = document.getElementById('backdrop');
  const body = document.getElementById('modalBody');
  const titleEl = document.getElementById('modalTitle');
  let lastFocus = null;
  function openModal(title, html) {
    lastFocus = document.activeElement;
    titleEl.textContent = title;
    body.innerHTML = html;
    backdrop.classList.add('open');
    backdrop.scrollTop = 0;
    document.getElementById('closeBtn').focus();
  }
  function closeModal() { backdrop.classList.remove('open'); tip.style.display = 'none'; if (lastFocus) lastFocus.focus(); }
  document.getElementById('closeBtn').onclick = closeModal;
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && backdrop.classList.contains('open')) closeModal(); });

  // Tooltip
  const tip = document.getElementById('tip');
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (!el) { tip.style.display = 'none'; return; } tip.innerHTML = el.getAttribute('data-tip'); tip.style.display = 'block'; });
  document.addEventListener('mousemove', e => { if (tip.style.display === 'block') { const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px'; } });

  // ---------- Gráficos (SVG, uma série cada, tema claro) ----------
  const C = { grid: '#e1e1dc', axis: '#52514e', series: '#2a78d6', surface: '#fcfcfb', ref: '#52514e' };
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function chartFrame(maxV, fmtAxis, inner) {
    const w = 320, h = 150, l = 44, r = 8, t = 10, b = 22, pw = w - l - r, ph = h - t - b;
    const n = String(maxV)[0] === '2' ? 4 : 5;
    let g = '';
    for (let i = 0; i <= n; i++) {
      const v = maxV * i / n, y = t + ph - ph * i / n;
      g += `<line x1="${l}" x2="${w - r}" y1="${y}" y2="${y}" stroke="${C.grid}" stroke-width="1"/>`;
      g += `<text x="${l - 6}" y="${y + 3}" fill="${C.axis}" font-size="9" text-anchor="end">${fmtAxis(v)}</text>`;
    }
    dayLabels.forEach((d, i) => { const x = l + pw * (i + .5) / DAYS; g += `<text x="${x}" y="${h - 6}" fill="${C.axis}" font-size="9" text-anchor="middle">${d}</text>`; });
    return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}${inner({ l, t, pw, ph, w, h })}</svg>`;
  }
  function barChart(vals, fmt) {
    const maxV = niceMax(Math.max(...vals));
    return chartFrame(maxV, v => int.format(Math.round(v)), ({ l, t, pw, ph }) => vals.map((v, i) => {
      const slot = pw / DAYS, bw = slot * .5, x = l + slot * i + (slot - bw) / 2, bh = Math.max(1, v / maxV * ph), y = t + ph - bh, rr = Math.min(4, bh, bw / 2);
      const path = `M${x},${t + ph} V${y + rr} Q${x},${y} ${x + rr},${y} H${x + bw - rr} Q${x + bw},${y} ${x + bw},${y + rr} V${t + ph} Z`;
      return `<path d="${path}" fill="${C.series}"/><rect x="${l + slot * i}" y="${t}" width="${slot}" height="${ph}" fill="transparent" data-tip="${dayLabels[i]}: <b>${fmt(v)}</b>"/>`;
    }).join(''));
  }
  function lineChart(vals, fmt, ref) {
    const finite = vals.filter(isFinite);
    const maxV = niceMax(Math.max(...finite, ref * 1.1));
    return chartFrame(maxV, v => brl0.format(v), ({ l, t, pw, ph, w }) => {
      const X = i => l + pw * (i + .5) / DAYS, Y = v => t + ph - v / maxV * ph;
      const pts = vals.map((v, i) => isFinite(v) ? [X(i), Y(v)] : null);
      const d = pts.filter(Boolean).map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1]).join(' ');
      let s = `<line x1="${l}" x2="${w - 8}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="${C.ref}" stroke-width="1" stroke-dasharray="4 3"/>`;
      s += `<text x="${w - 10}" y="${Y(ref) - 4}" fill="${C.ref}" font-size="9" text-anchor="end">Meta ${brl0.format(ref)}</text>`;
      s += `<path d="${d}" fill="none" stroke="${C.series}" stroke-width="2" stroke-linejoin="round"/>`;
      pts.forEach(p => { if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${C.series}" stroke="${C.surface}" stroke-width="2"/>`; });
      vals.forEach((v, i) => { s += `<rect x="${l + pw * i / DAYS}" y="${t}" width="${pw / DAYS}" height="${ph}" fill="transparent" data-tip="${dayLabels[i]}: <b>${fmt(v)}</b>"/>`; });
      return s;
    });
  }

  // ---------- Conteúdo das janelas ----------
  const kpi = (k, v, s = '') => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  const rowCells = m => `<td>${money(m.spend)}</td><td>${int.format(m.leads)}</td><td>${money(m.cpl)}</td><td>${pct(m.ctr)}</td><td>${pct(m.connect)}</td><td>${pct(m.conv)}</td>`;
  const HEAD = '<th>Investimento</th><th>Leads</th><th>CPL</th><th>CTR</th><th>Connect rate</th><th>Conv. página</th>';

  function openTV(c) {
    const m = c.m;
    const leadsDay = c.daily.map(d => d.leads);
    const cplDay = c.daily.map(d => d.leads ? d.spend / d.leads : Infinity);
    openModal('📺 ' + c.name, `
      <div class="sub">${badge(m.cpl)} <span>Ativa · Orçamento ${brl0.format(c.budget)}/dia · Objetivo: Leads · Últimos 7 dias</span></div>
      <h3>Números principais</h3>
      <div class="kpis">
        ${kpi('Leads', int.format(m.leads))}
        ${kpi('Investimento', money(m.spend))}
        ${kpi('CPL', money(m.cpl), `Meta: ${brl0.format(metaCPL)}`)}
        ${kpi('Connect rate', pct(m.connect), 'Visitas na página ÷ cliques')}
        ${kpi('Conv. da página', pct(m.conv), 'Leads ÷ visitas na página')}
        ${kpi('CTR', pct(m.ctr))}
        ${kpi('CPC', money(m.cpc))}
        ${kpi('CPM', money(m.cpm))}
        ${kpi('Impressões', int.format(m.imp))}
        ${kpi('Cliques no link', int.format(m.clicks))}
        ${kpi('Frequência', dec.format(m.freq))}
      </div>
      <h3>Dia a dia</h3>
      <div class="charts">
        <div class="chart"><div class="t">Leads por dia</div>${barChart(leadsDay, v => int.format(v) + ' leads')}</div>
        <div class="chart"><div class="t">CPL por dia</div>${lineChart(cplDay, v => money(v), metaCPL)}</div>
      </div>
      <h3>Conjuntos de anúncios</h3>
      <div class="scroll"><table><thead><tr><th>Conjunto</th>${HEAD}<th>Status</th></tr></thead><tbody>
        ${c.adsets.map(s => `<tr><td>${esc(s.name)}</td>${rowCells(s.m)}<td>${badge(s.m.cpl)}</td></tr>`).join('')}
      </tbody></table></div>
      <h3>Anúncios</h3>
      <div class="scroll"><table><thead><tr><th>Anúncio</th>${HEAD}<th>Status</th><th>Copy</th></tr></thead><tbody>
        ${c.adsets.flatMap(s => s.ads).map(ad => `<tr><td>${esc(ad.name)}</td>${rowCells(ad.m)}<td>${badge(ad.m.cpl)}</td><td class="wrap-cell"><b>${esc(ad.headline)}</b><br>${esc(ad.text)}</td></tr>`).join('')}
      </tbody></table></div>
    `);
  }

  function openGestor() {
    const t = total();
    const worstAds = [...allAds].filter(x => statusOf(x.ad.m.cpl) === 'critical').sort((a, z) => z.ad.m.cpl - a.ad.m.cpl);
    const best = [...CAMPAIGNS].sort((a, z) => a.m.cpl - z.m.cpl)[0];
    openModal('👨‍💻 Gestor de Tráfego', `
      <div class="sub">Visão das campanhas · últimos 7 dias</div>
      <div class="kpis" style="margin-top:12px">
        ${kpi('Investimento', money(t.spend))}${kpi('Leads', int.format(t.leads))}${kpi('CPL médio', money(t.cpl))}
        ${kpi('Orçamento diário', brl0.format(CAMPAIGNS.reduce((a, c) => a + c.budget, 0)))}
        ${kpi('Investido hoje', money(allDaily[DAYS - 1].spend))}
      </div>
      <h3>Campanhas</h3>
      <div class="scroll"><table><thead><tr><th>Campanha</th><th>Status</th><th>Orçamento/dia</th>${HEAD}</tr></thead><tbody>
        ${CAMPAIGNS.map(c => `<tr><td>${esc(c.name)}</td><td>${badge(c.m.cpl)}</td><td>${brl0.format(c.budget)}</td>${rowCells(c.m)}</tr>`).join('')}
      </tbody></table></div>
      <h3>Sugestões do gestor</h3>
      <div class="card"><ul>
        ${worstAds.length ? worstAds.slice(0, 3).map(x => `<li>Pausar o anúncio <b>${esc(x.ad.name)}</b> (${esc(x.c.short)}): CPL ${money(x.ad.m.cpl)}.</li>`).join('') : '<li>Nenhum anúncio muito acima da meta.</li>'}
        ${statusOf(best.m.cpl) === 'good' ? `<li>Aumentar em até 20% o orçamento de <b>${esc(best.name)}</b>, que está com CPL ${money(best.m.cpl)}.</li>` : ''}
      </ul><p class="copy">Nesta versão o gestor só sugere. Na fase com inteligência ele poderá executar, dentro dos limites combinados.</p></div>
    `);
  }

  function openCopy() {
    const sorted = [...allAds].sort((a, z) => z.ad.m.ctr - a.ad.m.ctr);
    openModal('✍️ Copywriter', `
      <div class="sub" style="margin-bottom:12px">Textos dos anúncios, do maior para o menor CTR · últimos 7 dias</div>
      ${sorted.map((x, i) => `<div class="card">
        <h4>${i === 0 ? '🏆 ' : i === sorted.length - 1 ? '⚠️ ' : ''}${esc(x.ad.name)} <span style="color:var(--ink-2);font-weight:400;font-size:13px">· ${esc(x.c.short)} · ${esc(x.s.name)}</span></h4>
        <p class="copy"><b>${esc(x.ad.headline)}</b><br>${esc(x.ad.text)}</p>
        <div class="sub" style="margin-top:8px"><span>CTR <b>${pct(x.ad.m.ctr)}</b></span><span>CPL <b>${money(x.ad.m.cpl)}</b></span><span>Leads <b>${int.format(x.ad.m.leads)}</b></span>${badge(x.ad.m.cpl)}</div>
      </div>`).join('')}
    `);
  }

  function analystInsights() {
    return {
      camps: [...CAMPAIGNS].sort((a, z) => a.m.cpl - z.m.cpl),
      sets: [...allSets].sort((a, z) => a.s.m.cpl - z.s.m.cpl),
      ads: [...allAds].sort((a, z) => a.ad.m.cpl - z.ad.m.cpl),
      conn: [...CAMPAIGNS].sort((a, z) => z.m.connect - a.m.connect),
    };
  }
  const MEDAL = ['🥇', '🥈', '🥉'];

  function openAnalista() {
    const { camps, sets, ads, conn } = analystInsights();
    const lastOf = a => a[a.length - 1];
    openModal('📊 Analista de Dados', `
      <div class="sub">Ranking por CPL (menor é melhor) · últimos 7 dias</div>
      <h3>Campanhas</h3>
      <div class="scroll"><table><thead><tr><th>#</th><th>Campanha</th><th>Status</th>${HEAD}</tr></thead><tbody>
        ${camps.map((c, i) => `<tr><td>${MEDAL[i] || i + 1}</td><td style="text-align:left">${esc(c.name)}</td><td>${badge(c.m.cpl)}</td>${rowCells(c.m)}</tr>`).join('')}
      </tbody></table></div>
      <h3>Achados</h3>
      <div class="card"><ul>
        <li>Melhor conjunto: <b>${esc(sets[0].s.name)}</b> (${esc(sets[0].c.short)}), CPL ${money(sets[0].s.m.cpl)}.</li>
        <li>Pior conjunto: <b>${esc(lastOf(sets).s.name)}</b> (${esc(lastOf(sets).c.short)}), CPL ${money(lastOf(sets).s.m.cpl)}.</li>
        <li>Melhor anúncio: <b>${esc(ads[0].ad.name)}</b> (${esc(ads[0].c.short)}), CPL ${money(ads[0].ad.m.cpl)}.</li>
        <li>Pior anúncio: <b>${esc(lastOf(ads).ad.name)}</b> (${esc(lastOf(ads).c.short)}), CPL ${money(lastOf(ads).ad.m.cpl)}.</li>
        <li>Melhor connect rate: <b>${esc(conn[0].name)}</b> (${pct(conn[0].m.connect)}). Pior: <b>${esc(lastOf(conn).name)}</b> (${pct(lastOf(conn).m.connect)}). Connect rate baixo costuma indicar página lenta.</li>
      </ul></div>
    `);
  }

  function openGerente() {
    const t = total(), today = metrics([allDaily[DAYS - 1]]);
    const { camps, ads } = analystInsights();
    const byCtr = [...allAds].sort((a, z) => z.ad.m.ctr - a.ad.m.ctr);
    const bad = camps.filter(c => statusOf(c.m.cpl) !== 'good');
    openModal('👔 Relatório do Gerente', `
      <div class="sub">${new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}</div>
      <h3>Resumo do dia</h3>
      <div class="card summary">
        Hoje: <b>${int.format(today.leads)} leads</b> com <b>${money(today.spend)}</b> investidos, CPL de <b>${money(today.cpl)}</b> ${badge(today.cpl)}.
        Nos últimos 7 dias foram ${int.format(t.leads)} leads a ${money(t.cpl)} cada.
        Melhor campanha: <b>${esc(camps[0].name)}</b> (CPL ${money(camps[0].m.cpl)}).
        ${bad.length ? `Atenção: <b>${bad.map(c => esc(c.name)).join('</b> e <b>')}</b> ${bad.length > 1 ? 'estão' : 'está'} acima da meta de ${brl0.format(metaCPL)}.` : 'Todas as campanhas estão dentro da meta. 🎉'}
      </div>
      <h3>Por colaborador</h3>
      <div class="card"><h4>👨‍💻 Gestor de Tráfego</h4><ul>
        <li>Investimento 7d: ${money(t.spend)} · Leads: ${int.format(t.leads)} · CPL médio: ${money(t.cpl)}</li>
        <li>Campanhas ativas: ${CAMPAIGNS.length} · Pausadas: 0</li>
      </ul></div>
      <div class="card"><h4>✍️ Copywriter</h4><ul>
        <li>Melhor CTR: <b>${esc(byCtr[0].ad.name)}</b> (${pct(byCtr[0].ad.m.ctr)}): "${esc(byCtr[0].ad.headline)}"</li>
        <li>Pior CTR: <b>${esc(byCtr[byCtr.length - 1].ad.name)}</b> (${pct(byCtr[byCtr.length - 1].ad.m.ctr)}). Vale testar um novo texto.</li>
      </ul></div>
      <div class="card"><h4>📊 Analista de Dados</h4><ul>
        ${camps.map((c, i) => `<li>${MEDAL[i] || i + 1} ${esc(c.name)}: CPL ${money(c.m.cpl)} · ${int.format(c.m.leads)} leads ${badge(c.m.cpl)}</li>`).join('')}
        <li>Melhor anúncio: <b>${esc(ads[0].ad.name)}</b>, CPL ${money(ads[0].ad.m.cpl)}</li>
      </ul></div>
    `);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
